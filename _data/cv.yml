- title: Experience
  type: time_table
  contents:
    - title: Research Associate & PhD-track Researcher
      institution: IISYS at Hof University, Hof, Germany
      year: 2023 - now
      description:
        - Researched and developed multimodal AI systems within the Intelligent and Learning Systems group, covering the full stack from multi-GPU model training and fine-tuning to production inference deployment via vLLM and Ollama.
        - Built a multi-GPU inference stack with Proxmox GPU passthrough, CUDA environment configuration, and tensor-parallel LLM serving via vLLM. Benchmarked quantization schemes (bitsandbytes INT4/INT8, AWQ, GPTQ) across precision–performance tradeoffs.
        - Profiled inference at the CUDA kernel level with NVIDIA Nsight Systems and torch.profiler; analysed KV cache memory footprints under PagedAttention across attention variants (MHA, GQA, MQA). Fine-tuned models with LoRA across multiple GPUs using DDP and FSDP via Hugging Face Accelerate; built evaluation pipelines with lm-evaluation-harness.
        - Bridged academic research and industry application by transferring AI solutions into active production environments for small and medium-sized German businesses, translating published findings into practical, deployable systems.
        - Conducted research in mechanistic interpretability, applying circuit analysis techniques to locate and characterise attention heads causally responsible for prompt injection in instruction-tuned LLMs (TransformerLens, activation patching, direct logit attribution).
    - title: AI Prototype Engineer Intern
      institution: IBM Germany, Munich, Germany
      year: 2020
      description:
        - Developed anomaly detection pipelines on large-scale infrastructure datasets for road and bridge safety analysis using Python and Apache Spark on IBM Cloud.
        - Designed and deployed a customer-facing conversational AI system on a Pepper robot, integrating IBM Watson Assistant with live APIs (weather, news) and custom dialogue flows for lobby guest interaction.
        - Collaborated with solution architects to prototype and refine customer-oriented AI demos across multiple client engagements.

